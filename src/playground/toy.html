<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Click counter</title>
  <link rel="stylesheet" href="/css/retro.css">
</head>
<body>
  <h1 class="logo">Click counter</h1>
  <button id="b">Click me</button> Clicks: <b id="n">0</b>
  <script>
    let n = 0;
    document.getElementById("b").onclick = () => {
      document.getElementById("n").textContent = ++n;
    };
  </script>
  <p><a href="/playground/">&laquo; Playground</a></p>
</body>
</html>
